services:
  db-auth:
    image: postgres:16-alpine
    container_name: paaptol-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_auth
    ports:
      - "54321:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paaptol_auth"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-search:
    image: postgres:16-alpine
    container_name: paaptol-search-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_search
    ports:
      - "54322:5432"
    volumes:
      - pgdata_search:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paaptol_search"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-cart:
    image: postgres:16-alpine
    container_name: paaptol-cart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_cart
    ports:
      - "54323:5432"
    volumes:
      - pgdata_cart:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paaptol_cart"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-buy:
    image: postgres:16-alpine
    container_name: paaptol-buy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_buy
    ports:
      - "54324:5432"
    volumes:
      - pgdata_buy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paaptol_buy"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-payment:
    image: postgres:16-alpine
    container_name: paaptol-payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_payment
    ports:
      - "54325:5432"
    volumes:
      - pgdata_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paaptol_payment"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 25s

  db-setup:
    build: .
    image: ecommerce-app
    container_name: paaptol-db-setup
    command: npx tsx src/scripts/setup-microservices-db.ts
    environment:
      DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
      AUTH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
      SEARCH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-search:5432/paaptol_search
      CART_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-cart:5432/paaptol_cart
      BUY_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-buy:5432/paaptol_buy
      PAYMENT_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-payment:5432/paaptol_payment
    depends_on:
      db-auth:
        condition: service_healthy
      db-search:
        condition: service_healthy
      db-cart:
        condition: service_healthy
      db-buy:
        condition: service_healthy
      db-payment:
        condition: service_healthy

  auth-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-auth-service
    command: npx tsx src/services/auth.ts
    environment:
      AUTH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
    ports:
      - "3001:3001"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  search-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-search-service
    command: npx tsx src/services/search.ts
    environment:
      SEARCH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-search:5432/paaptol_search
    ports:
      - "3002:3002"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  cart-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-cart-service
    command: npx tsx src/services/cart.ts
    environment:
      CART_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-cart:5432/paaptol_cart
    ports:
      - "3003:3003"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  buy-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-buy-service
    command: npx tsx src/services/buy.ts
    environment:
      BUY_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-buy:5432/paaptol_buy
      SEARCH_SERVICE_URL: http://search-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3005
    ports:
      - "3004:3004"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      search-service:
        condition: service_started
      payment-service:
        condition: service_started

  payment-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-payment-service
    command: npx tsx src/services/payment.ts
    environment:
      PAYMENT_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-payment:5432/paaptol_payment
    ports:
      - "3005:3005"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  gateway-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-gateway-service
    command: npx tsx src/services/gateway.ts
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      SEARCH_SERVICE_URL: http://search-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      BUY_SERVICE_URL: http://buy-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
    ports:
      - "5000:5000"
    depends_on:
      auth-service:
        condition: service_started
      search-service:
        condition: service_started
      cart-service:
        condition: service_started
      buy-service:
        condition: service_started
      payment-service:
        condition: service_started

  frontend:
    build: .
    image: ecommerce-app
    container_name: paaptol-frontend
    command: npm run dev
    environment:
      NEXT_GATEWAY_URL: http://gateway-service:5000
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_started
      db-setup:
        condition: service_completed_successfully

volumes:
  pgdata_auth:
  pgdata_search:
  pgdata_cart:
  pgdata_buy:
  pgdata_payment:
