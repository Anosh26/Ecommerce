services:
  db-auth:
    image: postgres:16-alpine
    container_name: paaptol-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_auth
    ports:
      - "54321:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paaptol_auth" ]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-search:
    image: postgres:16-alpine
    container_name: paaptol-search-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_search
    ports:
      - "54322:5432"
    volumes:
      - pgdata_search:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paaptol_search" ]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-cart:
    image: postgres:16-alpine
    container_name: paaptol-cart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_cart
    ports:
      - "54323:5432"
    volumes:
      - pgdata_cart:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paaptol_cart" ]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-order:
    image: postgres:16-alpine
    container_name: paaptol-order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwyhao268910_@&[+619hsksh2901h
      POSTGRES_DB: paaptol_order
    ports:
      - "54324:5432"
    volumes:
      - pgdata_order:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paaptol_order" ]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-setup:
    build: .
    image: ecommerce-app
    container_name: paaptol-db-setup
    command: npx tsx src/scripts/setup-microservices-db.ts
    environment:
      AUTH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
      SEARCH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-search:5432/paaptol_search
      CART_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-cart:5432/paaptol_cart
      ORDER_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-order:5432/paaptol_order
    depends_on:
      db-auth:
        condition: service_healthy
      db-search:
        condition: service_healthy
      db-cart:
        condition: service_healthy
      db-order:
        condition: service_healthy

  auth-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-auth-service
    command: npx tsx src/services/auth.ts
    environment:
      AUTH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
    ports:
      - "3001:3001"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  search-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-search-service
    command: npx tsx src/services/search.ts
    environment:
      SEARCH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-search:5432/paaptol_search
    ports:
      - "3002:3002"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  cart-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-cart-service
    command: npx tsx src/services/cart.ts
    environment:
      CART_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-cart:5432/paaptol_cart
    ports:
      - "3003:3003"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  order-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-order-service
    command: npx tsx src/services/order.ts
    environment:
      ORDER_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-order:5432/paaptol_order
      SEARCH_SERVICE_URL: http://search-service:3002
    ports:
      - "3004:3004"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      search-service:
        condition: service_started

  db-sync-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-db-sync-service
    command: npx tsx src/services/db-sync.ts
    environment:
      AUTH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-auth:5432/paaptol_auth
      SEARCH_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-search:5432/paaptol_search
      CART_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-cart:5432/paaptol_cart
      ORDER_DATABASE_URL: postgresql://postgres:Qwyhao268910_%40%26%5B%2B619hsksh2901h@db-order:5432/paaptol_order
    ports:
      - "3006:3006"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  gateway-service:
    build: .
    image: ecommerce-app
    container_name: paaptol-gateway-service
    command: npx tsx src/services/gateway.ts
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      SEARCH_SERVICE_URL: http://search-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      SYNC_SERVICE_URL: http://db-sync-service:3006
    ports:
      - "5000:5000"
    depends_on:
      auth-service:
        condition: service_started
      search-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      db-sync-service:
        condition: service_started

  frontend:
    build: .
    image: ecommerce-app
    container_name: paaptol-frontend
    command: npm run dev
    environment:
      NEXT_GATEWAY_URL: http://gateway-service:5000
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_started
      db-setup:
        condition: service_completed_successfully

volumes:
  pgdata_auth:
  pgdata_search:
  pgdata_cart:
  pgdata_order:
